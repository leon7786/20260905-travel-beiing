    // State
    let selectedProvince = "ALL";
    let selectedType = "ALL";
    let searchQuery = "";

    // Province badge style helper
    function getProvinceBadgeStyle(prov) {
      if (prov.includes("河北")) return "bg-sky-50 text-sky-700 border-sky-200";
      if (prov.includes("辽宁")) return "bg-emerald-50 text-emerald-700 border-emerald-200";
      if (prov.includes("内蒙古")) return "bg-teal-50 text-teal-700 border-teal-200";
      if (prov.includes("吉林") || prov.includes("黑龙江")) return "bg-blue-50 text-blue-700 border-blue-200";
      if (prov.includes("北京") || prov.includes("天津")) return "bg-indigo-50 text-indigo-700 border-indigo-200";
      if (prov.includes("山东") || prov.includes("山西")) return "bg-amber-50 text-amber-700 border-amber-200";
      return "bg-slate-100 text-slate-700 border-slate-200";
    }

    // Category icon helper
    function getCategoryIcon(cat) {
      switch(cat) {
        case "山岳": return "mountain";
        case "长城": return "shield";
        case "海滨": return "waves";
        case "草原": return "trees";
        case "湿地": return "droplets";
        case "古建": return "landmark";
        case "溶洞": return "gem";
        default: return "compass";
      }
    }

    // Render Cards
    function renderSpots() {
      const grid = document.getElementById('spotsGrid');
      const emptyState = document.getElementById('emptyState');
      grid.innerHTML = '';

      const filtered = SPOTS_DATA.filter(item => {
        // Province Match
        let provMatch = false;
        if (selectedProvince === "ALL") provMatch = true;
        else if (selectedProvince === "京津") provMatch = (item.province === "北京" || item.province === "天津");
        else if (selectedProvince === "吉黑") provMatch = (item.province === "吉林" || item.province === "黑龙江");
        else if (selectedProvince === "晋鲁") provMatch = (item.province === "山西" || item.province === "山东");
        else provMatch = (item.province === selectedProvince);
        // Type Match
        const typeMatch = (selectedType === "ALL" || item.categoryTag === selectedType || item.landscapeType.includes(selectedType));
        // Search Match
        const searchMatch = !searchQuery || 
          item.fullName.toLowerCase().includes(searchQuery) ||
          item.province.toLowerCase().includes(searchQuery) ||
          item.landscapeType.toLowerCase().includes(searchQuery) ||
          item.desc.toLowerCase().includes(searchQuery) ||
          item.subSpots.some(s => s.toLowerCase().includes(searchQuery));

        return provMatch && typeMatch && searchMatch;
      });

      document.getElementById('statFilteredCount').textContent = `${filtered.length} 处`;

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      filtered.forEach(spot => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl border border-slate-200/90 hover:border-sky-300 p-4 shadow-xs hover:shadow-md transition-all duration-200 flex flex-col justify-between group";

        const provStyle = getProvinceBadgeStyle(spot.province);
        const iconName = getCategoryIcon(spot.categoryTag);

        card.innerHTML = `
          <div>
            <!-- Top Tag Row -->
            <div class="flex items-center justify-between gap-2 mb-2.5">
              <span class="text-[11px] font-bold px-2 py-0.5 rounded-md border font-mono ${provStyle}">
                ${spot.province}
              </span>
              <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 flex items-center gap-1 border border-slate-200/70">
                <i data-lucide="${iconName}" class="w-3 h-3 text-slate-500"></i>
                <span>${spot.landscapeType}</span>
              </span>
            </div>

            <!-- Scenic Name -->
            <h3 class="font-bold text-sm sm:text-base text-slate-900 group-hover:text-sky-700 transition leading-snug">
              ${spot.fullName}
            </h3>

            <!-- Sub Spots breakdown pills -->
            <div class="mt-2.5 flex flex-wrap gap-1.5">
              ${spot.subSpots.map(sub => `
                <span class="text-[10px] sm:text-[11px] font-medium px-2 py-0.5 rounded-md bg-slate-50 text-slate-600 border border-slate-200/80">
                  📍 ${sub}
                </span>
              `).join('')}
            </div>

            <!-- Description -->
            <p class="mt-3 text-xs text-slate-500 leading-relaxed line-clamp-3">
              ${spot.desc}
            </p>
          </div>

          <!-- Card Bottom Action -->
          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between gap-1.5">
            <span class="text-[10px] text-slate-400 font-mono hidden xs:inline">
              [${spot.coords[0].toFixed(2)}°N, ${spot.coords[1].toFixed(2)}°E]
            </span>
            <div class="flex items-center gap-1.5 ml-auto">
              <a 
                href="index.html?spot=${encodeURIComponent(spot.shortName || spot.mainSpot)}"
                class="px-2.5 py-1 rounded-lg bg-sky-50 hover:bg-sky-100 text-sky-700 font-semibold text-xs border border-sky-200/70 flex items-center gap-1 active:scale-95 transition"
                title="在地图中居中并查看景点详情"
              >
                <i data-lucide="navigation" class="w-3 h-3"></i>
                <span>在地图中查看</span>
              </a>
              <a 
                href="index.html?mode=custom&addSpot=${spot.id}"
                class="px-2.5 py-1 rounded-lg bg-purple-50 hover:bg-purple-100 text-purple-700 font-semibold text-xs border border-purple-200/70 flex items-center gap-1 active:scale-95 transition"
                title="将此景点加入自定义自驾连线"
              >
                <i data-lucide="plus" class="w-3 h-3 text-purple-600"></i>
                <span>加入画线</span>
              </a>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    // Province Filter Handler
    function filterByProvince(prov, btn) {
      selectedProvince = prov;
      document.querySelectorAll('.province-btn').forEach(b => {
        b.className = 'province-btn px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-600 hover:text-slate-900 font-medium shrink-0 transition';
      });
      btn.className = 'province-btn px-3 py-1.5 rounded-lg font-bold bg-sky-600 text-white shadow-xs shrink-0 transition';
      renderSpots();
    }

    // Type Filter Handler
    function filterByType(type, btn) {
      selectedType = type;
      document.querySelectorAll('.type-btn').forEach(b => {
        b.className = 'type-btn px-2.5 py-1 rounded-md bg-white border border-slate-200 text-slate-600 hover:text-slate-900 font-medium shrink-0 transition';
      });
      btn.className = 'type-btn px-2.5 py-1 rounded-md font-semibold bg-slate-800 text-white shrink-0 transition';
      renderSpots();
    }

    // Reset Filters
    function resetFilters() {
      selectedProvince = "ALL";
      selectedType = "ALL";
      searchQuery = "";
      document.getElementById('spotSearchInput').value = "";
      document.getElementById('clearSearchBtn').classList.add('hidden');

      // Reset button styles
      const firstProvBtn = document.querySelector('.province-btn');
      if (firstProvBtn) filterByProvince('ALL', firstProvBtn);
      const firstTypeBtn = document.querySelector('.type-btn');
      if (firstTypeBtn) filterByType('ALL', firstTypeBtn);

      renderSpots();
    }

    // Search Input Listeners
    const searchInput = document.getElementById('spotSearchInput');
    const clearBtn = document.getElementById('clearSearchBtn');

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      if (searchQuery) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderSpots();
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = "";
      searchQuery = "";
      clearBtn.classList.add('hidden');
      renderSpots();
    });

    // Boot
    window.addEventListener('DOMContentLoaded', () => {
      renderSpots();
    });
  </script>
</body>
</html>
